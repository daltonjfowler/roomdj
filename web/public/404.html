<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomDJ</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Dark unless the visitor picked Light (src/theme.js): blocking, before the first paint -->
  <script src="/theme-boot.js"></script>
  <style>
    :root { --bg: #ffffff; --ink: #14181d; --muted: #5b6570; --accent: #be185d; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #121314; --ink: #e6edf3; --muted: #9198a1; --accent: #f472b6; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <img src="/icon.svg" alt="" width="54" height="54">
    <h1>Nothing here yet</h1>
    <p>RoomDJ has no page here.</p>
    <p><a href="/">Back to the start</a></p>
  </div>
</body>
</html>
